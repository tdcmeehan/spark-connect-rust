[package]
name = "apache-spark-connect-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The shared core of the Spark Connect client: transport, plan building, execution requests and Arrow decoding"

[lib]
name = "spark_connect_core"

[dependencies]
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto", version = "4.3.0" }
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
prost.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
arrow.workspace = true
futures.workspace = true
bytes.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true
serde = "1"
serde_json = "1"
regex = "1"
prost-types.workspace = true
crc32fast = "1"
sha2 = "0.10"
# Optional: only pulled in by the `wasm-udf` feature.
base64 = { version = "0.21", optional = true }
# Local time for the reprs of timestamp literals, as Python's `datetime.fromtimestamp`.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Optional conversions of collected batches (the `interop` module).
datafusion = { workspace = true, optional = true }
polars = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
# sha2 0.10 requires this feature for ARM hardware acceleration; sha2-asm excludes Windows.
sha2 = { version = "0.10", features = ["asm"] }

[features]
# Build Rust UDFs that run on Spark via WebAssembly (the `wasm_udf` module).
wasm-udf = ["dep:base64"]
# Convert collected batches into a datafusion::dataframe::DataFrame.
datafusion = ["dep:datafusion"]
# Convert collected batches into a polars::frame::DataFrame.
polars = ["dep:polars"]

[dev-dependencies]
tempfile = "3"
tonic-prost.workspace = true
