[package]
name = "apache-spark-connect-async"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "An async Rust client for Spark Connect, with typed results and Rust errors"

[lib]
name = "spark_connect_async"

[dependencies]
spark-connect-core = { package = "apache-spark-connect-core", path = "../spark-connect-core", version = "4.3.0" }
spark-connect-proto = { package = "apache-spark-connect-proto", path = "../spark-connect-proto", version = "4.3.0" }
arrow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
futures.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tonic.workspace = true
datafusion = { workspace = true, optional = true }
polars = { workspace = true, optional = true }

[features]
# DataFrame::to_datafusion, a datafusion::dataframe::DataFrame of the result.
datafusion = ["dep:datafusion", "spark-connect-core/datafusion"]
# DataFrame::to_polars, a polars::frame::DataFrame of the result.
polars = ["dep:polars", "spark-connect-core/polars"]

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
spark-connect = { package = "apache-spark-connect", path = "../spark-connect", version = "4.3.0" }
prost.workspace = true
tempfile = "3"
