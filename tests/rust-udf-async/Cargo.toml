# Rust UDFs of the async client, apache-spark-connect-async: fixture UDFs built with
# `#[spark_udf(crate = spark_connect_async)]`, the tests of that option, and the tests that run
# them end to end on a Spark Connect server.
[package]
name = "rust-udf-async-tests"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../../crates/spark-connect-macros" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
spark-connect-async = { package = "apache-spark-connect-async", path = "../../crates/spark-connect-async", features = ["rust-udf"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
spark-connect-async = { package = "apache-spark-connect-async", path = "../../crates/spark-connect-async", features = ["blocking", "rust-udf"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
spark-connect-build = { package = "apache-spark-connect-build", path = "../../crates/spark-connect-build" }
spark-connect-macros = { package = "apache-spark-connect-macros", path = "../../crates/spark-connect-macros" }
